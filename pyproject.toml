[project]
name = "codeatlas"
version = "0.1.0"
description = "Semantic code indexing with symbol extraction, SQLite FTS, and Qdrant vector search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.4.0",
    "pyyaml>=6.0.0",
    "qdrant-client>=1.9.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
llm = [
    "litellm>=1.50.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
mcp = [
    "mcp>=1.9.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"
codeatlas-eval = "evals.run_retrieval_eval:main"
codeatlas-defects4j-eval = "evals.defects4j.run_fault_localization_eval:main"
codeatlas-index = "codeatlas.indexing.repository_indexer:main"
codeatlas-mcp = "codeatlas.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeatlas", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
